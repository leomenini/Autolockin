[project]
name = "autolockin"
version = "0.1.0"
description = "An n8n-style flowchart of your tasks that gates folders and games on your PC"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
autolockin = "autolockin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autolockin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
